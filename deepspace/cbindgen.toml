# cbindgen 配置 — 生成 include/deepspace.h
# 对应 Rust 实现：deepspace/src/ffi.rs

language = "C"
autogen_warning = "/* NOTE: This file is generated by cbindgen from deepspace/src/ffi.rs — do not edit manually. */"
include_guard = "DEEPSPACE_H"
no_includes = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

# 显式 include C 标准头（no_includes=true 时手动给出）
after_includes = """
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>
"""

[export]
# 只导出 ffi 模块的符号
include = ["ffi"]
# 排除 lib.rs 顶层的物理常量（外部引擎不需要，避免头文件污染/符号冲突）
exclude = [
    "G",
    "G0",
    "AIR_GAS_CONSTANT",
    "GAMMA_AIR",
    "EARTH_EQUATORIAL_RADIUS",
    "EARTH_POLAR_RADIUS",
    "EARTH_FLATTENING",
    "EARTH_MASS",
    "EARTH_MU",
    "EARTH_OMEGA",
    "EARTH_J2",
    # EnduranceStation 关联常量被 cbindgen 0.29 的 exclude-constants bug 漏掉
    # （library.rs remove_excluded 用 filter 未重新赋值）；无害宏，留存
    "EnduranceStation_RADIUS",
    "EnduranceStation_NORMAL_RPM",
    "EnduranceStation_EMERGENCY_RPM",
]

[enum]
# 枚举加前缀：DSEntityKind 的变体 → DSK_Rocket（保持手写契约的可读风格）
prefix_with_name = true
rename_variants = "PascalCase"
